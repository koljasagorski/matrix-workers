name: Public production health
on:
  schedule:
    - cron: '29 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-production-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          check-latest: true
      - run: node .github/scripts/check-production-health.cjs
