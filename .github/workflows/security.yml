name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: check (${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
      - run: npm ci
      - name: Test the automatic update merge policy
        run: node --test .github/scripts/check-update-policy.cjs
      - name: Test the public production-check policy using fake responses
        run: node --test .github/scripts/check-production-health-policy.cjs
      - name: Test the trusted-main VPS deployment policy using fake API responses
        run: node --test deploy/vps/tests/check-workflow-policy.cjs
      - run: npm run check
      - name: Validate D1 migrations on the Workers runtime
        run: npm run db:migrate:local
      - name: Ensure migrations are safe to reapply
        run: npm run db:migrate:local
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@7999b86c43a865dc79d8923397f35af22de63401 # v4
  migration-check:
    name: migration-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the deployment's pinned Synapse image
        id: synapse
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          compose = pathlib.Path('deploy/vps/docker-compose.yml').read_text()
          images = re.findall(r'^    image: (ghcr\.io/element-hq/synapse:v\d+\.\d+\.\d+@sha256:[0-9a-f]{64})$', compose, re.M)
          if len(images) != 1:
              raise SystemExit('Expected one digest-pinned Synapse deployment image')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('image=' + images[0] + '\n')
              postgres = re.findall(r'^    image: (postgres:\d+-alpine@sha256:[0-9a-f]{64})$', compose, re.M)
              if len(postgres) != 1:
                  raise SystemExit('Expected one digest-pinned PostgreSQL deployment image')
              output.write('postgres=' + postgres[0] + '\n')
          PY
      - name: Test signed native room import against the deployment codec
        env:
          SYNAPSE_IMAGE: ${{ steps.synapse.outputs.image }}
        run: |
          docker run --rm --network none \
            --volume "$PWD/scripts/migration:/migration:ro" \
            --entrypoint python "$SYNAPSE_IMAGE" \
            -m unittest discover -s /migration/rooms/tests -v
      - name: Boot native schema and verify a complete synthetic room migration
        env:
          SYNAPSE_IMAGE: ${{ steps.synapse.outputs.image }}
          POSTGRES_IMAGE: ${{ steps.synapse.outputs.postgres }}
        run: |
          python3 scripts/migration/rooms/tests/ci_smoke.py \
            --synapse-image "$SYNAPSE_IMAGE" --postgres-image "$POSTGRES_IMAGE"
      - name: Test gateway, archive, auth and encrypted user-data migration
        run: |
          python3 -m venv "$RUNNER_TEMP/matrix-migration-venv"
          "$RUNNER_TEMP/matrix-migration-venv/bin/pip" install \
            --requirement scripts/migration/auth/requirements.txt \
            --requirement scripts/migration/requirements-federation-replay.txt
          "$RUNNER_TEMP/matrix-migration-venv/bin/python" -m unittest discover -s scripts/migration/auth/tests -v
          "$RUNNER_TEMP/matrix-migration-venv/bin/python" -m unittest discover -s scripts/migration/archive_tests -v
          "$RUNNER_TEMP/matrix-migration-venv/bin/python" -m unittest discover -s scripts/migration/media_tests -v
          "$RUNNER_TEMP/matrix-migration-venv/bin/python" -m unittest discover -s scripts/migration/replay_tests -v
      - name: Test reviewed VPS deployment and rollback with fake operations
        run: python3 -m unittest discover -s deploy/vps/tests -v
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
